<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Code for Digital Resturant Menu</title>

    <!-- Bootstrap css CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <!-- Bootstrap JS CDN  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a href="" class="navbar-brand">Generate QR Code</a>
        </div>
    </nav>

    <!-- QR Code Form  -->
     <!-- actiion means what should happen when u submit this form -->
      <!-- here generate_qr_code is the name of url  path('', views.gerenate_qr_code, name='gerenate_qr_code') -->
    
    <div class="container mt-5" style="width:  600px; border: 1px solid #d3d3d3; padding:30px; border-radius:10px">
        <form action="{% url 'generate_qr_code' %}" method="POST"> 
            {% csrf_token %}  
    
            <!--  as_p is as parameter #render form -->
            {{form.as_p}}
    
            <button type="submit" class="btn btn-primary">Generate QR Code</button>
        </form>
    </div>


  </body>
</html>
